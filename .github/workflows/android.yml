
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o MushroomLegendsAndroid_Project.zip -d extracted
          test -f extracted/MushroomLegendsAndroid/settings.gradle

      - name: Build APK
        run: gradle -p extracted/MushroomLegendsAndroid assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MushroomLegends-debug-apk
          path: extracted/MushroomLegendsAndroid/app/build/outputs/apk/debug/app-debug.apk
app/build/outputs/apk/debug/app-debug.apk
