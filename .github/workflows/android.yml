
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o MushroomLegendsAndroid_Project.zip -d extracted
          test -f extracted/MushroomLegendsAndroid/settings.gradle

      - name: Build APK
        run: gradle -p extracted/MushroomLegendsAndroid assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MushroomLegends-debug-apk
          path: extracted/MushroomLegendsAndroid/app/build/outputs/apk/debug/app-debug.apk
